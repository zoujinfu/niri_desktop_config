# ============================================================
# hyprlock 配置 —— Catppuccin Mocha 风格 (与 waybar 配色一致)
#
# 调用: niri config.kdl 的 Ctrl+Alt+L
# 手工测: hyprlock --verbose
# 万一卡住 / 想强制解锁: pkill -USR1 hyprlock
# 备份: hyprlock.conf.bak-<日期>-<原因>
#
# 层次 (zindex): background(-1) < shape 遮罩(1) < label / input-field(2)
# ============================================================

general {
    hide_cursor = true
    # 空密码直接回车不算一次验证尝试
    ignore_empty_input = true
    # 认证失败后 UI 复位前的等待 (毫秒)
    fail_timeout = 2500
    # 背景截图: 0 = GPU 加速, 1 = CPU (慢但对合成器兼容性更好)
    # niri 下若背景糊不出来或报 screencopy 错误, 先改成 1 试
    screencopy_mode = 0
    # ⚠️ 必须开: 否则 hyprlock 会一直等到背景截图就绪才开始绘制,
    #    这段时间屏幕全黑、要按一下键才出现界面 (2026-09-24 用户实际反馈)。
    #    开了之后锁屏瞬间就先画一帧 (用下面的 background.color + 时间/密码框)。
    immediate_render = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

# ---------- 背景: 截当前桌面那一帧再模糊 ----------
background {
    monitor =
    path = screenshot
    # 截图尚未就绪时的兜底底色 (Catppuccin base)
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3
    blur_size = 10
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

# ---------- 深色遮罩 ----------
# 必须有: 截到浅色窗口时, 浅色文字会糊在亮背景里看不清 (2026-09-24 实测踩过)
shape {
    monitor =
    size = 100%, 100%
    color = rgba(24, 24, 37, 0.62)   # Catppuccin mantle
    rounding = 0
    zindex = 1
}

# ---------- 大号时间 ----------
label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 0.96)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
    zindex = 2
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(17, 17, 27, 0.6)
}

# ---------- 日期 (每分钟刷新一次) ----------
label {
    monitor =
    text = cmd[update:60000] date "+%Y年%m月%d日 %A"
    color = rgba(186, 194, 222, 0.95)
    font_size = 20
    font_family = Noto Sans CJK SC
    position = 0, 116
    halign = center
    valign = center
    zindex = 2
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(17, 17, 27, 0.6)
}

# ---------- 密码输入框 (输错 / 输对 的反馈都在这里) ----------
input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    rounding = 16
    position = 0, -110
    halign = center
    valign = center
    zindex = 2

    # 半透明深色内框 + mauve 描边
    inner_color = rgba(24, 24, 37, 0.85)
    outer_color = rgba(203, 166, 247, 0.9)
    font_color = rgba(205, 214, 244, 1.0)
    font_family = JetBrainsMono Nerd Font

    # 三种状态色: 验证中 = peach, 失败 = red, 大写锁定 = yellow
    check_color = rgba(250, 179, 135, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    capslock_color = rgba(249, 226, 175, 1.0)

    # 注意: pango markup 里的颜色 hex 要写 ## (单个 # 会被当注释吃掉)
    placeholder_text = <span foreground="##a6adc8">输入密码</span>
    check_text = <span foreground="##fab387">验证中...</span>
    fail_text = <span foreground="##f38ba8">密码错误, 请重试 ($ATTEMPTS)</span>

    # 不因为空输入淡出, 一眼能看到输了几位
    fade_on_empty = false
    dots_size = 0.26
    dots_spacing = 0.18
    dots_center = true
}
